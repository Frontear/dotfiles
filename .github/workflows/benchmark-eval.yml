name: Benchmark Evaluation Speed

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

jobs:
  benchmark:
    if: github.event.pull_request.merged == true

    name: Benchmark NixOS Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            allow-import-from-derivation = false
            eval-cache = false
            experimental-features = flakes nix-command
            extra-experimental-features = pipe-operators

      - name: Benchmark LAPTOP-3DT4F02
        run: |
          nix build .#nix-benchmark &> /dev/null # only see benchmark output
          sudo ./result/bin/nix-benchmark --flake '.#nixosConfigurations.LAPTOP-3DT4F02.config.system.build.toplevel'

      - name: "Commit Benchmark Result"
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: "feat: publish latest benchmark results"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}